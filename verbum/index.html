<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Verbum — Телефон-Конспектатор</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 30, 49, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --accent-grad: linear-gradient(135deg, #0284c7, #38bdf8);
      --danger: #ef4444;
      --danger-grad: linear-gradient(135deg, #dc2626, #ef4444);
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 20px) 16px;
      overflow-x: hidden;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      background: var(--accent-grad);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #041226;
      font-size: 18px;
    }
    .brand-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand-sub {
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-badge {
      font-size: 12px;
      padding: 5px 12px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      border-radius: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #34d399;
      border-radius: 50%;
      box-shadow: 0 0 8px #34d399;
    }
    .status-badge.recording .status-dot {
      background: var(--danger);
      box-shadow: 0 0 10px var(--danger);
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse { to { opacity: 0.3; transform: scale(1.2); } }

    .main-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .cockpit-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px 20px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 18px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
    }
    .timer-display {
      font-size: 38px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      color: var(--text);
    }
    .timer-label {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: -12px;
    }
    .visualizer-canvas {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      background: rgba(0,0,0,0.25);
    }

    .record-btn {
      width: 100%;
      max-width: 280px;
      padding: 18px 24px;
      border-radius: 18px;
      border: none;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      color: #041226;
      background: var(--accent-grad);
      box-shadow: 0 8px 24px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .record-btn:active {
      transform: scale(0.96);
    }
    .record-btn.active {
      background: var(--danger-grad);
      color: #fff;
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.4);
    }

    .mode-pills {
      display: flex;
      background: rgba(0,0,0,0.3);
      padding: 4px;
      border-radius: 14px;
      gap: 4px;
      width: 100%;
    }
    .mode-pill {
      flex: 1;
      padding: 8px 4px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      background: transparent;
      border: none;
      cursor: pointer;
    }
    .mode-pill.active {
      background: rgba(255,255,255,0.12);
      color: var(--text);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-action {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.06);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-action:active { background: rgba(255,255,255,0.16); }

    .utterance-stream {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }
    .utterance-item {
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 10px 12px;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .utterance-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .speaker-badge {
      background: rgba(56, 189, 248, 0.2);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 700;
    }
    .speaker-badge.remote {
      background: rgba(168, 85, 247, 0.2);
      color: #c084fc;
    }
    .utterance-text {
      font-size: 14px;
      line-height: 1.45;
      color: #f1f5f9;
    }

    .notes-box {
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 14px;
      font-size: 14px;
      line-height: 1.55;
      color: #e2e8f0;
      white-space: pre-wrap;
      max-height: 260px;
      overflow-y: auto;
      font-family: inherit;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0f172a;
      border: 1px solid var(--accent);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 999;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <a id="hubBackBtn" href="/" style="display:none; text-decoration:none; color:var(--text-dim); margin-right:6px; font-size:13px; font-weight:700; padding:6px 10px; border-radius:10px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.08);">← Хаб</a>
      <div class="brand-icon">V</div>
      <div>
        <div class="brand-title">Verbum</div>
        <div class="brand-sub">Телефон-Конспектатор</div>
      </div>
    </div>
    <div id="statusBadge" class="status-badge">
      <span class="status-dot"></span>
      <span id="statusText">Готов к записи</span>
    </div>
  </header>

  <div class="main-container">
    <div class="cockpit-card">
      <div class="mode-pills">
        <button id="modeLecture" class="mode-pill active" onclick="setMode('lecture')">Конспект / Лекция</button>
        <button id="modeMeeting" class="mode-pill" onclick="setMode('meeting')">Встреча / Диалог</button>
      </div>

      <div>
        <div id="timerDisplay" class="timer-display">00:00:00</div>
        <div id="sessionTitle" class="timer-label">Нажмите кнопку, чтобы начать запись</div>
      </div>

      <canvas id="visualizer" class="visualizer-canvas"></canvas>

      <button id="recordBtn" class="record-btn" onclick="toggleRecording()">
        <svg id="micIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
        <span id="recordLabel">Начать конспект</span>
      </button>
    </div>

    <!-- Live Captions Card -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          Живые субтитры
        </div>
        <button class="btn-action" onclick="clearLiveStream()">Очистить</button>
      </div>
      <div id="utteranceStream" class="utterance-stream">
        <div style="color: var(--text-dim); font-size: 13px; text-align: center; padding: 20px 0;">
          Говорите в телефон — слова сразу появятся здесь в реальном времени.
        </div>
      </div>
    </div>

    <!-- Finalized Protocol & Notes Card -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
          Полный конспект
        </div>
        <div style="display:flex; gap:6px;">
          <button class="btn-action" onclick="copyNotes()">Скопировать</button>
          <button class="btn-action" onclick="downloadNotes()">Скачать .md</button>
        </div>
      </div>
      <div id="notesBox" class="notes-box">Конспект сохраняется локально на ПК в реальном времени.</div>
    </div>
  </div>

  <div id="toast" class="toast">Текст скопирован в буфер!</div>

  <script>
    const API_BASE = window.location.pathname.startsWith('/verbum') ? '/verbum/api' : '/api';
    if (window.location.pathname.startsWith('/verbum')) {
      document.getElementById('hubBackBtn').style.display = 'inline-block';
    }
    let isRecording = false;
    let currentMode = 'lecture';
    let audioContext = null;
    let mediaStream = null;
    let processorNode = null;
    let timerInterval = null;
    let startTime = 0;
    let sseSource = null;
    let fullNotesText = "";

    function setMode(mode) {
      if (isRecording) return;
      currentMode = mode;
      document.getElementById('modeLecture').classList.toggle('active', mode === 'lecture');
      document.getElementById('modeMeeting').classList.toggle('active', mode === 'meeting');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function updateTimer() {
      if (!isRecording) return;
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
      const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
      const s = String(elapsed % 60).padStart(2, '0');
      document.getElementById('timerDisplay').innerText = `${h}:${m}:${s}`;
    }

    async function toggleRecording() {
      if (!isRecording) {
        await startRecording();
      } else {
        await stopRecording();
      }
    }

    function downsampleTo16k(buffer, inputSampleRate) {
      if (inputSampleRate === 16000) {
        const int16 = new Int16Array(buffer.length);
        for (let i = 0; i < buffer.length; i++) {
          const s = Math.max(-1, Math.min(1, buffer[i]));
          int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        return int16;
      }
      const ratio = inputSampleRate / 16000;
      const newLen = Math.round(buffer.length / ratio);
      const result = new Int16Array(newLen);
      let offsetResult = 0;
      let offsetBuffer = 0;
      while (offsetResult < result.length) {
        const nextOffset = Math.round((offsetResult + 1) * ratio);
        let accum = 0, count = 0;
        for (let i = offsetBuffer; i < nextOffset && i < buffer.length; i++) {
          accum += buffer[i];
          count++;
        }
        const sample = count > 0 ? (accum / count) : buffer[offsetBuffer];
        const s = Math.max(-1, Math.min(1, sample));
        result[offsetResult] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        offsetResult++;
        offsetBuffer = nextOffset;
      }
      return result;
    }

    async function startRecording() {
      try {
        // 1. Request microphone access (iOS Safari compatible constraints)
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          });
        } catch (e1) {
          mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }

        // 2. Start server session
        const resp = await fetch(`${API_BASE}/session/start`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode: currentMode })
        });
        const data = await resp.json();
        document.getElementById('sessionTitle').innerText = data.filename || 'Идет запись конспекта...';

        // 3. Setup Web Audio streaming
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioCtx();
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }

        const source = audioContext.createMediaStreamSource(mediaStream);

        // Visualizer Analyser
        const analyser = audioContext.createAnalyser();
        analyser.fftSize = 64;
        source.connect(analyser);
        drawVisualizer(analyser);

        // Audio processor for PCM chunks
        const bufferSize = 4096;
        processorNode = audioContext.createScriptProcessor(bufferSize, 1, 1);
        const inputSampleRate = audioContext.sampleRate;
        processorNode.onaudioprocess = (e) => {
          if (!isRecording) return;
          const inputData = e.inputBuffer.getChannelData(0);
          const pcm16 = downsampleTo16k(inputData, inputSampleRate);
          sendAudioChunkPCM(pcm16);
        };
        source.connect(processorNode);
        processorNode.connect(audioContext.destination);

        // UI state
        isRecording = true;
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 500);

        const btn = document.getElementById('recordBtn');
        btn.classList.add('active');
        document.getElementById('recordLabel').innerText = 'Завершить запись';
        
        const badge = document.getElementById('statusBadge');
        badge.classList.add('recording');
        document.getElementById('statusText').innerText = 'Идёт конспектирование...';

        connectSSE();
      } catch (err) {
        alert('Ошибка доступа к микрофону: ' + err.message);
      }
    }

    function sendAudioChunkPCM(int16Array) {
      fetch(`${API_BASE}/audio/chunk`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/octet-stream' },
        body: int16Array.buffer
      }).catch(() => {});
    }

    async function stopRecording() {
      isRecording = false;
      clearInterval(timerInterval);

      if (processorNode) { processorNode.disconnect(); processorNode = null; }
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      if (audioContext) { audioContext.close(); audioContext = null; }

      const btn = document.getElementById('recordBtn');
      btn.classList.remove('active');
      document.getElementById('recordLabel').innerText = 'Начать конспект';
      
      const badge = document.getElementById('statusBadge');
      badge.classList.remove('recording');
      document.getElementById('statusText').innerText = 'Сохранено на ПК';

      // Call stop API
      const resp = await fetch(`${API_BASE}/session/stop`, { method: 'POST' });
      const data = await resp.json();
      if (data.notes) {
        fullNotesText = data.notes;
        document.getElementById('notesBox').innerText = fullNotesText;
      }
      showToast('Конспект успешно сформирован и сохранён на ПК!');
    }

    function connectSSE() {
      if (sseSource) sseSource.close();
      sseSource = new EventSource(`${API_BASE}/events`);
      sseSource.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'utterance') {
            appendUtterance(msg);
          } else if (msg.type === 'full_notes') {
            fullNotesText = msg.text;
            document.getElementById('notesBox').innerText = fullNotesText;
          }
        } catch (e) {}
      };
    }

    function appendUtterance(msg) {
      const stream = document.getElementById('utteranceStream');
      if (stream.children.length === 1 && stream.children[0].innerText.includes('Говорите в телефон')) {
        stream.innerHTML = '';
      }
      const item = document.createElement('div');
      item.className = 'utterance-item';
      const isYou = msg.speaker === 'Вы' || msg.speaker === 'Автор';
      item.innerHTML = `
        <div class="utterance-meta">
          <span class="speaker-badge ${isYou ? '' : 'remote'}">${msg.speaker}</span>
          <span>${msg.time || ''}</span>
        </div>
        <div class="utterance-text">${msg.text}</div>
      `;
      stream.appendChild(item);
      stream.scrollTop = stream.scrollHeight;

      fullNotesText += `[${msg.time || ''}] ${msg.speaker}: ${msg.text}

`;
      document.getElementById('notesBox').innerText = fullNotesText;
    }

    function clearLiveStream() {
      document.getElementById('utteranceStream').innerHTML = `
        <div style="color: var(--text-dim); font-size: 13px; text-align: center; padding: 20px 0;">
          Субтитры очищены. Говорите в микрофон для записи.
        </div>`;
    }

    function copyNotes() {
      if (!fullNotesText) { showToast('Конспект пока пуст'); return; }
      navigator.clipboard.writeText(fullNotesText).then(() => {
        showToast('Весь конспект скопирован!');
      });
    }

    function downloadNotes() {
      if (!fullNotesText) { showToast('Конспект пока пуст'); return; }
      const blob = new Blob([fullNotesText], { type: 'text/markdown;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Конспект_${new Date().toISOString().slice(0,10)}.md`;
      a.click();
    }

    function drawVisualizer(analyser) {
      const canvas = document.getElementById('visualizer');
      const ctx = canvas.getContext('2d');
      const dataArray = new Uint8Array(analyser.frequencyBinCount);

      function render() {
        if (!isRecording) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          return;
        }
        requestAnimationFrame(render);
        analyser.getByteFrequencyData(dataArray);

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const barWidth = (canvas.width / dataArray.length) * 1.5;
        let x = 0;

        for (let i = 0; i < dataArray.length; i++) {
          const barHeight = (dataArray[i] / 255) * canvas.height;
          ctx.fillStyle = `rgba(56, 189, 248, ${Math.max(0.2, dataArray[i]/255)})`;
          ctx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);
          x += barWidth;
        }
      }
      render();
    }

    // Connect SSE on load
    connectSSE();
  </script>
</body>
</html>
