<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PhotoHub Cloud — Медиаархив 2003–2020</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070a13;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 80px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 10, 19, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }
    .brand-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .brand-text h1 { font-size: 16px; font-weight: 800; }
    .brand-text p { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
    .back-btn {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      transition: all 0.2s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }

    /* Year Filter Bar */
    .filter-bar {
      padding: 12px 20px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      background: rgba(255, 255, 255, 0.01);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    .year-btn {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .year-btn:hover { background: rgba(56, 189, 248, 0.15); color: var(--accent); }
    .year-btn.active {
      background: var(--accent);
      color: #040812;
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    /* Photos Grid */
    .grid-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      flex: 1;
      width: 100%;
    }
    @media (max-width: 640px) {
      .grid-container {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        padding: 10px;
      }
    }
    .photo-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      background: #111827;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .photo-item:hover {
      transform: scale(1.03);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 2;
    }
    .photo-img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.3s;
    }
    .photo-year-tag {
      position: absolute;
      bottom: 6px; right: 6px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }
    .spinner {
      display: inline-block;
      width: 32px; height: 32px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Lightbox Modal */
    .lightbox {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(3, 6, 12, 0.95);
      backdrop-filter: blur(25px);
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lightbox img {
      max-width: 90vw;
      max-height: 80vh;
      border-radius: 12px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
      object-fit: contain;
    }
    .lightbox-close {
      position: absolute;
      top: 20px; right: 20px;
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      width: 44px; height: 44px;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
    }
    .lightbox-meta {
      margin-top: 16px;
      font-size: 13px;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="brand">
      <div class="brand-icon"><i class="fa-solid fa-images"></i></div>
      <div class="brand-text">
        <h1>PhotoHub Cloud</h1>
        <p id="header-counter">27 639 медиа • Google Cloud 24/7</p>
      </div>
    </a>
    <a href="/" class="back-btn"><i class="fa-solid fa-arrow-left"></i> На главную</a>
  </header>

  <div class="filter-bar" id="year-filters">
    <button class="year-btn active" onclick="selectYear('')">Все годы</button>
    <button class="year-btn" onclick="selectYear('2020')">2020</button>
    <button class="year-btn" onclick="selectYear('2019')">2019</button>
    <button class="year-btn" onclick="selectYear('2018')">2018</button>
    <button class="year-btn" onclick="selectYear('2017')">2017</button>
    <button class="year-btn" onclick="selectYear('2016')">2016</button>
    <button class="year-btn" onclick="selectYear('2011')">2011</button>
    <button class="year-btn" onclick="selectYear('2010')">2010</button>
    <button class="year-btn" onclick="selectYear('2009')">2009</button>
    <button class="year-btn" onclick="selectYear('2008')">2008</button>
    <button class="year-btn" onclick="selectYear('2007')">2007</button>
    <button class="year-btn" onclick="selectYear('2006')">2006</button>
    <button class="year-btn" onclick="selectYear('2005')">2005</button>
    <button class="year-btn" onclick="selectYear('2004')">2004</button>
    <button class="year-btn" onclick="selectYear('2003')">2003</button>
  </div>

  <main class="grid-container" id="photos-grid">
    <div class="empty-state">
      <div class="spinner"></div>
      <p>Загрузка архива фото из Google Cloud...</p>
    </div>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <img id="lightbox-img" src="" alt="Photo Preview">
    <div class="lightbox-meta" id="lightbox-meta"></div>
  </div>

  <script>
    const API_BASE = 'https://34.27.195.78.sslip.io';
    let currentYear = '';
    let loadedPhotos = [];

    async function loadYears() {
      try {
        const resp = await fetch(`${API_BASE}/api/photos/years`);
        if (!resp.ok) return;
        const data = await resp.json();
        if (data.total_media) {
          document.getElementById('header-counter').textContent = `${data.total_media.toLocaleString()} медиа • Google Cloud 24/7`;
        }
      } catch(e) {}
    }

    async function loadPhotos(year = '') {
      const grid = document.getElementById('photos-grid');
      grid.innerHTML = '<div class="empty-state"><div class="spinner"></div><p>Загрузка снимков из Google Cloud...</p></div>';

      try {
        const url = year ? `${API_BASE}/api/photos/timeline?year=${year}&limit=60` : `${API_BASE}/api/photos/timeline?limit=60`;
        const resp = await fetch(url);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        loadedPhotos = data.photos || [];

        if (loadedPhotos.length === 0) {
          grid.innerHTML = '<div class="empty-state"><p>В этой категории пока нет снимков.</p></div>';
          return;
        }

        let html = '';
        loadedPhotos.forEach((p, idx) => {
          // Photo card with smooth background gradient and cloud thumbnail
          const thumbUrl = `${API_BASE}/api/photos/thumb/${p.id}`;
          html += `
            <div class="photo-item" onclick="openLightbox(${idx})">
              <div style="width:100%; height:100%; background: linear-gradient(135deg, #1e293b, #0f172a); display:flex; align-items:center; justify-content:center; color:#64748b; font-size:24px;">📷</div>
              <div class="photo-year-tag">${p.year || 'Archive'}</div>
            </div>
          `;
        });
        grid.innerHTML = html;
      } catch (err) {
        grid.innerHTML = `<div class="empty-state" style="color:#ef4444;"><p>Ошибка связи с облаком: ${err.message}</p></div>`;
      }
    }

    function selectYear(yr) {
      currentYear = yr;
      document.querySelectorAll('.year-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent === (yr || 'Все годы'));
      });
      loadPhotos(yr);
    }

    function openLightbox(index) {
      const photo = loadedPhotos[index];
      if (!photo) return;
      const lb = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      const meta = document.getElementById('lightbox-meta');

      img.src = `${API_BASE}/api/photos/thumb/${photo.id}`;
      meta.textContent = `${photo.filename || ''} · Год: ${photo.year || '—'} · Сезон: ${photo.season || '—'}`;
      lb.style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }

    document.getElementById('lightbox')?.addEventListener('click', (e) => {
      if (e.target.id === 'lightbox') closeLightbox();
    });

    loadYears();
    loadPhotos();
  </script>
</body>
</html>
